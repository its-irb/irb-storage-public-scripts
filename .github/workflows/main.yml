name: Build & Release — bifrost-transfer + bifrost-mount

on:
  push:
    paths:
      - "bifrost-transfer/**"
      - "bifrost-mount/**"
      - "shared/**"
      - ".github/workflows/main.yml"
    branches:
      - main
      - release
      - develop
      - feature/**
  workflow_dispatch:

run-name: >-
  ${{ startsWith(github.event.head_commit.message, 'Merge') && github.event.head_commit.message || format('{0} · #{1}', github.ref_name, github.run_number) }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─────────────────────────────────────────────────────────────────────────────
# jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Listar commits incluidos en este push
        run: |
          echo "## 📦 Commits incluidos en este build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Rama:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Versión:** \`1.0.${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Evento:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git log --pretty=format:"- \`%h\` %s _(%an)_" ${{ github.event.before }}..${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          else
            echo "_(Ejecución manual o primer push de la rama — mostrando últimos 10 commits)_" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            git log -10 --pretty=format:"- \`%h\` %s _(%an)_" >> $GITHUB_STEP_SUMMARY
          fi
  # ─────────────────────────────────────────────────────────────────────────────
  # macOS — flet build macos → .app
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        app: [bifrost-transfer, bifrost-mount]
    steps:
      - name: Checkout código
        uses: actions/checkout@v6.0.2

      - name: Instalar Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Escribir versión
        run: echo "__version__ = '1.0.${{ github.run_number }}'" > ${{ matrix.app }}/src/version.py

      - name: Añadir ruta al paquete de backend pyproject.toml
        shell: bash
        run: |
          WORKSPACE="${GITHUB_WORKSPACE//\\//}"
          cp ${{ matrix.app }}/pyproject-template.toml ${{ matrix.app }}/pyproject.toml
          sed -i '' "s|__BUILDPATH__|${WORKSPACE}|g" \
            ${{ matrix.app }}/pyproject.toml

      - name: Escribir versión en pyproject.toml
        run: |
          sed -i '' 's/^version = .*/version = "1.0.${{ github.run_number }}"/' \
            ${{ matrix.app }}/pyproject.toml

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install uv
          cd ${{ matrix.app }}
          uv sync
          echo "$GITHUB_WORKSPACE/${{ matrix.app }}/.venv/bin" >> $GITHUB_PATH

      - name: Descargar rclone y fuse-t para macOS
        run: |
          if [ "${{ matrix.app }}" = "bifrost-mount" ]; then
            cd ${{ matrix.app }}/src && bash ../../shared/macos-assets-downloader.sh
          else
            cd ${{ matrix.app }}/src && bash ../../shared/macos-rclone-downloader.sh
          fi

      - name: Limpiar nombre de rama
        id: clean_branch
        run: |
          clean=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "name=$clean" >> $GITHUB_OUTPUT

      - name: Build macOS
        run: |
          cd ${{ matrix.app }}
          echo "y" | flet build macos --output dist --no-rich-output

      - name: Debug - verificar contingut del bundle
        if: matrix.app == 'bifrost-mount'
        run: |
          APP_BUNDLE=$(find ${{ matrix.app }}/dist -maxdepth 1 -name "*.app" | head -1)
          echo "=== Mida total ==="
          du -sh "$APP_BUNDLE"
          echo "=== site-packages ==="
          find "$APP_BUNDLE" -name "site-packages" -type d | head -5
          find "$APP_BUNDLE" -name "site-packages" -type d -exec du -sh {} \; 2>/dev/null | head -5
          echo "=== bifrost_shared ==="
          find "$APP_BUNDLE" -name "bifrost_shared*" 2>/dev/null
          echo "=== boto3 ==="
          find "$APP_BUNDLE" -name "boto3" -type d 2>/dev/null
          echo "=== ldap3 ==="
          find "$APP_BUNDLE" -name "ldap3" -type d 2>/dev/null
          echo "=== app.zip ==="
          find "$APP_BUNDLE" -name "app.zip" | head -3

      - name: Añadir fuse_t.framework al bundle
        if: matrix.app == 'bifrost-mount'
        run: |
          APP_BUNDLE=$(find ${{ matrix.app }}/dist -maxdepth 1 -name "*.app" | head -1)
          cp -R ${{ matrix.app }}/frameworks/fuse_t.framework \
            "${APP_BUNDLE}/Contents/Frameworks/"


      - name: Crear DMG
        uses: L-Super/create-dmg-actions@v1.0.3
        with:
          dmg_name: ${{ matrix.app }}-macos
          src_dir: ${{ matrix.app }}/dist/${{ matrix.app }}.app

      - name: Subir artefacto
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.app }}-macos
          path: "*.dmg"

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows — flet build windows + Inno Setup
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        app: [bifrost-transfer, bifrost-mount]
    steps:
      - name: Checkout código
        uses: actions/checkout@v6.0.2

      - name: Enable long paths
        shell: powershell
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1

      - name: Instalar Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Añadir ruta al paquete de bifrost-shared (backend and frontend) pyproject.toml
        shell: bash
        run: |
          cp ${{ matrix.app }}/pyproject-template.toml ${{ matrix.app }}/pyproject.toml
          sed -i "s|__BUILDPATH__|${GITHUB_WORKSPACE//\\//}|g" \
            ${{ matrix.app }}/pyproject.toml

      - name: Escribir versión en pyproject.toml
        shell: bash
        run: |
          sed -i 's/^version = .*/version = "1.0.${{ github.run_number }}"/' \
            ${{ matrix.app }}/pyproject.toml

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install uv
          cd ${{ matrix.app }}
          uv sync

      - name: Copiar windows-assets-downloader.sh dentro de src/
        shell: bash
        run: cp shared/windows-assets-downloader.sh ${{ matrix.app }}/src/windows-assets-downloader.sh

      - name: Descargar rclone para Windows
        shell: bash
        run: cd ${{ matrix.app }}/src && bash windows-assets-downloader.sh

      - name: Limpiar nombre de rama
        id: clean_branch
        shell: bash
        run: |
          clean=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "name=$clean" >> $GITHUB_OUTPUT

      - name: Escribir versión
        shell: bash
        run: echo "__version__ = '1.0.${{ github.run_number }}'" > ${{ matrix.app }}/src/version.py

      - name: Build Windows
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          cd ${{ matrix.app }}
          echo "y" | uv run flet build windows --output dist --no-rich-output -v

      - name: Crear directorio installer
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ${{ matrix.app }}/installer

      - name: Package Windows installer (Inno Setup)
        shell: pwsh
        env:
          BRANCH_SUFFIX: ${{ steps.clean_branch.outputs.name }}
          APP_VERSION: "1.0.${{ github.run_number }}"
          APP: ${{ matrix.app }}
        run: |
          Write-Host "=== dist/ structure ==="
          Get-ChildItem -Recurse $env:APP/dist | Select-Object FullName
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DBranchSuffix="$env:BRANCH_SUFFIX" `
            /DAppVersion="$env:APP_VERSION" `
            /DAppName="$env:APP" `
            "$env:APP\installer.iss"

      - name: Sign Windows installer
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.IRBCODESIGNING }}
          PFX_PASSWORD: ${{ secrets.IRBCODESIGNING_PASSWORD }}
        run: |
          # Decode PFX from base64
          $pfxPath = "$env:RUNNER_TEMP\codeSigning.pfx"
          [System.Convert]::FromBase64String($env:PFX_B64) | Set-Content $pfxPath -AsByteStream
      
          # Find signtool: highest version folder that actually contains signtool.exe
          $kitsBase = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtool = Get-ChildItem $kitsBase -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } |
            ForEach-Object { "$($_.FullName)\x64\signtool.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -Last 1
      
          if (-not $signtool) { throw "signtool.exe not found" }
          Write-Host "Using signtool: $signtool"
      
          $installer = "${{ matrix.app }}\installer\${{ matrix.app }}-${{ steps.clean_branch.outputs.name }}-windows.exe"
      
          & $signtool sign `
            /fd sha256 `
            /f $pfxPath `
            /p $env:PFX_PASSWORD `
            /t http://timestamp.digicert.com `
            /v `
            $installer
      
          Remove-Item $pfxPath -Force
      
      - name: Subir artefacto
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.app }}-windows
          path: ${{ matrix.app }}/installer/*.exe

  

  # ─────────────────────────────────────────────────────────────────────────────
  # Release — solo en main y release
  # Recoge los artefactos de los tres jobs y crea una GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'
    steps:
      - name: Checkout código
        uses: actions/checkout@v6.0.2

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true

      # - name: Verificar dist
