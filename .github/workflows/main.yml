name: Build & Release — bifrost-transfer + bifrost-mount

on:
  push:
    paths:
      - "bifrost-transfer/**"
      - "bifrost-mount/**"
      - "shared/**"
      - ".github/workflows/main.yml"
    branches:
      - main
      - release
      - develop
      - feature/**
  workflow_dispatch:

run-name: >-
  ${{ startsWith(github.event.head_commit.message, 'Merge') && github.event.head_commit.message || format('{0} · #{1}', github.ref_name, github.run_number) }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─────────────────────────────────────────────────────────────────────────────
# jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Versión — una sola para las dos apps (SemVer: MAYOR.MENOR.PARCHE), .github/scripts/next_version.py
  #  · main con commits que sacan versión (feat → MENOR; fix/perf/revert/build → PARCHE; `!` o
  #    BREAKING CHANGE → MAYOR; `Release-As: X.Y.Z` la fija): X.Y.Z, y el job release la publica.
  #  · Resto (otras ramas, o main con solo docs/refactor/ci…): la última release + el número de
  #    ejecución, X.Y.Z.N. El autoupdate la ve más nueva que su release (no ofrece "volver") y más
  #    antigua que la siguiente (sí ofrece actualizar cuando sale).
  # `base` (X.Y.Z) es la del pyproject.toml y el bundle: Flutter/macOS solo admiten tres números; el
  # cuarto va como build number (--build-number).
  # ─────────────────────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      base: ${{ steps.v.outputs.base }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Calcular versión
        id: v
        run: python3 .github/scripts/next_version.py version --ref "${{ github.ref }}" --run-number "${{ github.run_number }}"

  summary:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Listar commits incluidos en este push
        run: |
          echo "## 📦 Commits incluidos en este build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Rama:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Versión:** \`${{ needs.version.outputs.version }}\`${{ needs.version.outputs.is_release == 'true' && ' (release)' || '' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Evento:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git log --pretty=format:"- \`%h\` %s _(%an)_" ${{ github.event.before }}..${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          else
            echo "_(Ejecución manual o primer push de la rama — mostrando últimos 10 commits)_" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            git log -10 --pretty=format:"- \`%h\` %s _(%an)_" >> $GITHUB_STEP_SUMMARY
          fi
  # ─────────────────────────────────────────────────────────────────────────────
  # macOS — flet build macos → .app
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    needs: version
    runs-on: macos-26
    strategy:
      matrix:
        app: [bifrost-transfer, bifrost-mount]
    steps:
      - name: Checkout código
        uses: actions/checkout@v6.0.2

      - name: Instalar Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Escribir versión
        run: echo "__version__ = '${{ needs.version.outputs.version }}'" > ${{ matrix.app }}/src/version.py

      - name: Añadir ruta al paquete de backend pyproject.toml
        shell: bash
        run: |
          WORKSPACE="${GITHUB_WORKSPACE//\\//}"
          cp ${{ matrix.app }}/pyproject-template.toml ${{ matrix.app }}/pyproject.toml
          sed -i '' "s|__BUILDPATH__|${WORKSPACE}|g" \
            ${{ matrix.app }}/pyproject.toml

      - name: Escribir versión en pyproject.toml
        run: |
          sed -i '' 's/^version = .*/version = "${{ needs.version.outputs.base }}"/' \
            ${{ matrix.app }}/pyproject.toml

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install uv
          cd ${{ matrix.app }}
          uv sync
          echo "$GITHUB_WORKSPACE/${{ matrix.app }}/.venv/bin" >> $GITHUB_PATH

      - name: Descargar rclone y fuse-t para macOS
        env:
          RCLONE_ARCH: arm64
        run: |
          if [ "${{ matrix.app }}" = "bifrost-mount" ]; then
            cd ${{ matrix.app }}/src && bash ../../shared/macos-assets-downloader.sh
          else
            cd ${{ matrix.app }}/src && bash ../../shared/macos-rclone-downloader.sh
          fi

      - name: Limpiar nombre de rama
        id: clean_branch
        run: |
          clean=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "name=$clean" >> $GITHUB_OUTPUT

      - name: Build macOS
        run: |
          cd ${{ matrix.app }}
          echo "y" | flet build macos --output dist --no-rich-output \
            --build-version ${{ needs.version.outputs.base }} --build-number ${{ github.run_number }}

      - name: Debug - verificar contingut del bundle
        if: matrix.app == 'bifrost-mount'
        run: |
          APP_BUNDLE=$(find ${{ matrix.app }}/dist -maxdepth 1 -name "*.app" | head -1)
          echo "=== Mida total ==="
          du -sh "$APP_BUNDLE"
          echo "=== site-packages ==="
          find "$APP_BUNDLE" -name "site-packages" -type d | head -5
          find "$APP_BUNDLE" -name "site-packages" -type d -exec du -sh {} \; 2>/dev/null | head -5
          echo "=== bifrost_shared ==="
          find "$APP_BUNDLE" -name "bifrost_shared*" 2>/dev/null
          echo "=== boto3 ==="
          find "$APP_BUNDLE" -name "boto3" -type d 2>/dev/null
          echo "=== ldap3 ==="
          find "$APP_BUNDLE" -name "ldap3" -type d 2>/dev/null
          echo "=== app.zip ==="
          find "$APP_BUNDLE" -name "app.zip" | head -3

      - name: Añadir fuse_t.framework al bundle
        if: matrix.app == 'bifrost-mount'
        run: |
          APP_BUNDLE=$(find ${{ matrix.app }}/dist -maxdepth 1 -name "*.app" | head -1)
          cp -R ${{ matrix.app }}/frameworks/fuse_t.framework \
            "${APP_BUNDLE}/Contents/Frameworks/"


      - name: Crear DMG
        uses: L-Super/create-dmg-actions@v1.1.0
        with:
          dmg_name: ${{ matrix.app }}-macos
          src_dir: ${{ matrix.app }}/dist/${{ matrix.app }}.app

      - name: Subir artefacto
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.app }}-macos
          path: "*.dmg"

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS Intel — stopgap hasta nov-2026 (macos-14 es el último runner Intel)
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-intel:
    needs: version
    runs-on: macos-15-intel
    strategy:
      matrix:
        app: [bifrost-transfer, bifrost-mount]
    steps:
      - name: Checkout código
        uses: actions/checkout@v6.0.2

      - name: Instalar Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Escribir versión
        run: echo "__version__ = '${{ needs.version.outputs.version }}'" > ${{ matrix.app }}/src/version.py

      - name: Añadir ruta al paquete de backend pyproject.toml
        shell: bash
        run: |
          WORKSPACE="${GITHUB_WORKSPACE//\\//}"
          cp ${{ matrix.app }}/pyproject-template.toml ${{ matrix.app }}/pyproject.toml
          sed -i '' "s|__BUILDPATH__|${WORKSPACE}|g" \
            ${{ matrix.app }}/pyproject.toml

      - name: Escribir versión en pyproject.toml
        run: |
          sed -i '' 's/^version = .*/version = "${{ needs.version.outputs.base }}"/' \
            ${{ matrix.app }}/pyproject.toml

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install uv
          cd ${{ matrix.app }}
          uv sync
          echo "$GITHUB_WORKSPACE/${{ matrix.app }}/.venv/bin" >> $GITHUB_PATH

      - name: Descargar rclone y fuse-t para macOS (Intel)
        env:
          RCLONE_ARCH: amd64
        run: |
          if [ "${{ matrix.app }}" = "bifrost-mount" ]; then
            cd ${{ matrix.app }}/src && bash ../../shared/macos-assets-downloader.sh
          else
            cd ${{ matrix.app }}/src && bash ../../shared/macos-rclone-downloader.sh
          fi

      - name: Limpiar nombre de rama
        id: clean_branch
        run: |
          clean=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "name=$clean" >> $GITHUB_OUTPUT

      - name: Build macOS
        run: |
          cd ${{ matrix.app }}
          echo "y" | flet build macos --output dist --no-rich-output \
            --build-version ${{ needs.version.outputs.base }} --build-number ${{ github.run_number }}

      - name: Debug - verificar contingut del bundle
        if: matrix.app == 'bifrost-mount'
        run: |
          APP_BUNDLE=$(find ${{ matrix.app }}/dist -maxdepth 1 -name "*.app" | head -1)
          echo "=== Mida total ==="
          du -sh "$APP_BUNDLE"
          echo "=== site-packages ==="
          find "$APP_BUNDLE" -name "site-packages" -type d | head -5
          find "$APP_BUNDLE" -name "site-packages" -type d -exec du -sh {} \; 2>/dev/null | head -5
          echo "=== bifrost_shared ==="
          find "$APP_BUNDLE" -name "bifrost_shared*" 2>/dev/null
          echo "=== boto3 ==="
          find "$APP_BUNDLE" -name "boto3" -type d | head -5
          echo "=== ldap3 ==="
          find "$APP_BUNDLE" -name "ldap3" -type d | head -5
          echo "=== app.zip ==="
          find "$APP_BUNDLE" -name "app.zip" | head -3

      - name: Añadir fuse_t.framework al bundle
        if: matrix.app == 'bifrost-mount'
        run: |
          APP_BUNDLE=$(find ${{ matrix.app }}/dist -maxdepth 1 -name "*.app" | head -1)
          cp -R ${{ matrix.app }}/frameworks/fuse_t.framework \
            "${APP_BUNDLE}/Contents/Frameworks/"

      - name: Crear DMG
        uses: L-Super/create-dmg-actions@v1.1.0
        with:
          dmg_name: ${{ matrix.app }}-macos-intel
          src_dir: ${{ matrix.app }}/dist/${{ matrix.app }}.app

      - name: Subir artefacto
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.app }}-macos-intel
          path: "*.dmg"

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows — flet build windows + Inno Setup
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        app: [bifrost-transfer, bifrost-mount]
    steps:
      - name: Checkout código
        uses: actions/checkout@v6.0.2

      - name: Enable long paths
        shell: powershell
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1

      - name: Instalar Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Añadir ruta al paquete de bifrost-shared (backend and frontend) pyproject.toml
        shell: bash
        run: |
          cp ${{ matrix.app }}/pyproject-template.toml ${{ matrix.app }}/pyproject.toml
          sed -i "s|__BUILDPATH__|${GITHUB_WORKSPACE//\\//}|g" \
            ${{ matrix.app }}/pyproject.toml

      - name: Escribir versión en pyproject.toml
        shell: bash
        run: |
          sed -i 's/^version = .*/version = "${{ needs.version.outputs.base }}"/' \
            ${{ matrix.app }}/pyproject.toml

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install uv
          cd ${{ matrix.app }}
          uv sync

      - name: Copiar windows-assets-downloader.sh dentro de src/
        shell: bash
        run: cp shared/windows-assets-downloader.sh ${{ matrix.app }}/src/windows-assets-downloader.sh

      - name: Descargar rclone para Windows
        shell: bash
        run: cd ${{ matrix.app }}/src && bash windows-assets-downloader.sh

      - name: Limpiar nombre de rama
        id: clean_branch
        shell: bash
        run: |
          clean=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "name=$clean" >> $GITHUB_OUTPUT

      - name: Escribir versión
        shell: bash
        run: echo "__version__ = '${{ needs.version.outputs.version }}'" > ${{ matrix.app }}/src/version.py

      - name: Build Windows
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          cd ${{ matrix.app }}
          echo "y" | uv run flet build windows --output dist --no-rich-output -v \
            --build-version ${{ needs.version.outputs.base }} --build-number ${{ github.run_number }}

      - name: Crear directorio installer
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ${{ matrix.app }}/installer

      - name: Package Windows installer (Inno Setup)
        shell: pwsh
        env:
          BRANCH_SUFFIX: ${{ steps.clean_branch.outputs.name }}
          APP_VERSION: "${{ needs.version.outputs.version }}"
          APP: ${{ matrix.app }}
        run: |
          Write-Host "=== dist/ structure ==="
          Get-ChildItem -Recurse $env:APP/dist | Select-Object FullName
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DBranchSuffix="$env:BRANCH_SUFFIX" `
            /DAppVersion="$env:APP_VERSION" `
            /DAppName="$env:APP" `
            "$env:APP\installer.iss"

      - name: Sign Windows installer
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.IRBCODESIGNING }}
          PFX_PASSWORD: ${{ secrets.IRBCODESIGNING_PASSWORD }}
        run: |
          # Decode PFX from base64
          $pfxPath = "$env:RUNNER_TEMP\codeSigning.pfx"
          [System.Convert]::FromBase64String($env:PFX_B64) | Set-Content $pfxPath -AsByteStream
      
          # Find signtool: highest version folder that actually contains signtool.exe
          $kitsBase = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtool = Get-ChildItem $kitsBase -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } |
            ForEach-Object { "$($_.FullName)\x64\signtool.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -Last 1
      
          if (-not $signtool) { throw "signtool.exe not found" }
          Write-Host "Using signtool: $signtool"
      
          $installer = "${{ matrix.app }}\installer\${{ matrix.app }}-${{ steps.clean_branch.outputs.name }}-windows.exe"
      
          & $signtool sign `
            /fd sha256 `
            /f $pfxPath `
            /p $env:PFX_PASSWORD `
            /t http://timestamp.digicert.com `
            /v `
            $installer
      
          Remove-Item $pfxPath -Force
      
      # El .zip es para la descarga manual: los navegadores avisan al bajar un .exe
      # pero no un .zip. El .exe suelto se sigue publicando porque la
      # autoactualización (shared/bifrost_backend/common/updates.py) lo descarga
      # directamente; no quitarlo sin cambiar antes el updater.
      - name: Comprimir instalador en .zip
        shell: pwsh
        run: |
          $installer = Get-ChildItem "${{ matrix.app }}\installer\*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer .exe not found" }
          $zip = Join-Path $installer.DirectoryName ($installer.BaseName + ".zip")
          Compress-Archive -Path $installer.FullName -DestinationPath $zip
          Write-Host "Creado: $zip"

      - name: Subir artefacto
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.app }}-windows
          path: |
            ${{ matrix.app }}/installer/*.exe
            ${{ matrix.app }}/installer/*.zip

  

  # ─────────────────────────────────────────────────────────────────────────────
  # Publicar — un solo job para las dos ramas que publican, con los mismos pasos:
  #  · main, cuando el job version dice que estos commits sacan versión: la release vX.Y.Z
  #    ("Release vX.Y.Z", latest), que es la que ven el autoupdate y los usuarios.
  #  · develop, en cada push (al fusionar una PR): una sola prerelease, develop-latest
  #    ("Develop: vX.Y.Z.N"), que sustituye a la anterior. Sirve para descargar la build de pruebas
  #    desde Releases y, sobre todo, ejecuta en cada fusión a develop el mismo código que publicará en
  #    main: si la prerelease sale bien, en main solo cambian los valores del paso "Qué se publica".
  # La prerelease no afecta a los usuarios: el autoupdate solo mira la release "latest" y una
  # prerelease nunca lo es; y next_version.py solo cuenta los tags vX.Y.Z. El tag es develop-latest y
  # no "develop" para no chocar con el nombre de la rama.
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [version, build-macos, build-windows, build-macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/develop' || (github.ref == 'refs/heads/main' && needs.version.outputs.is_release == 'true')
    concurrency:
      group: publish-${{ github.ref_name }}   # dos pushes seguidos a la misma rama: uno detrás de otro
      cancel-in-progress: false
    steps:
      - name: Checkout código
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Qué se publica
        id: p
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tag="v$v"; name="Release v$v"; prerelease=false; latest=true; rolling=false
          else
            tag="develop-latest"; name="Develop: v$v"; prerelease=true; latest=false; rolling=true
          fi
          {
            echo "tag=$tag"; echo "name=$name"; echo "prerelease=$prerelease"
            echo "latest=$latest"; echo "rolling=$rolling"
          } >> "$GITHUB_OUTPUT"
          echo "Publica $name (tag $tag, prerelease: $prerelease, latest: $latest)"

      - name: Notas
        run: |
          {
            if [ "${{ steps.p.outputs.rolling }}" = "true" ]; then
              echo "Build de pruebas de \`develop\` (**v${{ needs.version.outputs.version }}**, commit ${GITHUB_SHA::7})."
              echo "No es una versión publicada: las apps no se actualizan a ella. Se sustituye en cada fusión a develop."
              echo ""
              echo "Lo que saldrá en la próxima release de main:"
              echo ""
            fi
            python3 .github/scripts/next_version.py notes
          } > release-notes.md
          cat release-notes.md

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true

      # La release publica el instalador de Windows de dos formas: <app>-windows.zip con el
      # .exe dentro, que es el que descargan los usuarios y el autoupdate (updates.py, sufijo
      # -windows.zip), y el .exe suelto, que lo siguen pidiendo las versiones anteriores
      # (sufijo -main-windows.exe). No cambiar estos nombres: romperían el autoupdate.
      - name: Comprimir instaladores de Windows en .zip
        shell: bash
        run: |
          set -euo pipefail
          for APP in bifrost-transfer bifrost-mount; do
            exe=$(ls dist/${APP}-*-windows.exe)
            zip -j "dist/${APP}-windows.zip" "$exe"
          done
          ls -lah dist/

      - name: Borrar la prerelease anterior y su tag (develop)
        if: steps.p.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.p.outputs.tag }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || echo "No había prerelease $TAG"
          git push origin ":refs/tags/$TAG" 2>/dev/null || true    # por si quedó el tag sin release

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.p.outputs.tag }}
          name: ${{ steps.p.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.p.outputs.prerelease }}
          make_latest: ${{ steps.p.outputs.latest }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
